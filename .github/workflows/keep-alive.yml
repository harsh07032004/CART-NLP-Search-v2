name: Keep demo backend warm

# Render free web services sleep after 15 min idle (~50 s cold start).
# Ping every 10 min from 08:30 to 20:30 IST (03:00-15:00 UTC) only, so the
# workspace stays inside Render's 750 free instance-hours per month.
on:
  schedule:
    - cron: "*/10 3-14 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: curl -fsS --max-time 90 "${{ vars.API_URL }}/health" || true
